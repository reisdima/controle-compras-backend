# =============================================================================
# Pipeline de entrega com GitHub Actions (substitui Jenkins no laboratório).
#
# O que faz:
#   - Checkout do repositório
#   - Cria um cluster Kubernetes efêmero com Kind dentro do runner
#   - Aplica k8s/deployment.yaml e k8s/prometheus.yaml
#   - Aguarda rollout dos Deployments
#
# Nenhum secret necessário: o Kind cria o cluster e o kubeconfig localmente.
#
# Opcional (build + push Docker Hub antes do deploy):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN — descomente o job "build-push-image".
# =============================================================================
name: Deploy Kubernetes (controle-compras namespace)

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

env:
  K8S_NAMESPACE: controle-compras

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar cluster Kind
        run: |
          set -euo pipefail
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
          kind create cluster --name controle-compras --wait 60s
          kubectl cluster-info --context kind-controle-compras

      - name: Aplicar Kubernetes
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/prometheus.yaml

      - name: Aguardar rollout
        run: |
          set -euo pipefail
          kubectl rollout status deployment/controle-compras-backend -n "$K8S_NAMESPACE" --timeout=300s
          kubectl rollout status deployment/prometheus -n "$K8S_NAMESPACE" --timeout=300s
          kubectl rollout status deployment/grafana -n "$K8S_NAMESPACE" --timeout=300s
          kubectl get pods,svc -n "$K8S_NAMESPACE"

  # ---------------------------------------------------------------------------
  # Job opcional — descomente o bloco "needs" em deploy se quiser build antes.
  # Requer secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
